version: '3.8'

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: edtech_pgvector
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-edtech_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-secret_password}
      POSTGRES_DB: ${PG_DB:-edtech_curricular}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edtech_admin -d edtech_curricular"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: